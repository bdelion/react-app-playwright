# Clé unique de ton projet Sonar
sonar.projectKey=my-react-app

# Nom du projet
sonar.projectName=My React App

# Langage principal (JS / TS)
sonar.language=js

# Sources du code à analyser
sonar.sources=src

# Exclure les fichiers de test si besoin
sonar.tests=src/__tests__,e2e

# Pattern pour trouver les tests unitaires
sonar.test.inclusions=src/__tests__/**/*.js

# Rapport de couverture généré par Jest (format LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Rapport JUnit généré par Playwright (pour les tests e2e)
sonar.junit.reportPaths=playwright-report/junit.xml

# Exclure les dossiers build/dist
sonar.exclusions=dist/**,node_modules/**

# Charset (optionnel)
sonar.sourceEncoding=UTF-8
